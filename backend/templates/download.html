<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An I/O Link — Descargar archivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111827; color: #f9fafb; font-family: system-ui, sans-serif; }
    .slash { color: #ef4444; }
    .card { background: #1f2937; border-radius: 0.75rem; padding: 1.5rem; max-width: 480px; width: 100%; }
    .label { color: #9ca3af; font-size: 0.875rem; margin-bottom: 0.5rem; }
    .token { font-family: monospace; font-size: 1.75rem; color: #2dd4bf; background: #111827; padding: 0.5rem 1.25rem; border-radius: 0.5rem; display: inline-block; margin-bottom: 1.5rem; letter-spacing: 0.2em; }
    .token-row { text-align: center; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; background: #0d9488; color: white; font-size: 1rem; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; border: none; cursor: pointer; transition: background 0.2s; width: 100%; justify-content: center; }
    .btn:hover { background: #0f766e; }
    .btn:disabled { background: #4b5563; cursor: not-allowed; }
    .progress-section { margin-top: 1rem; background: #374151; border-radius: 0.5rem; padding: 1rem; display: none; }
    .progress-header { display: flex; justify-content: space-between; font-size: 0.875rem; color: #d1d5db; margin-bottom: 0.25rem; }
    .progress-track { background: #4b5563; border-radius: 9999px; height: 8px; overflow: hidden; }
    .progress-bar { background: #0d9488; height: 8px; border-radius: 9999px; width: 0%; transition: width 0.3s ease-out; }
    .status { margin-top: 0.75rem; font-size: 0.875rem; color: #d1d5db; }
    .note { margin-top: 1rem; font-size: 0.8rem; color: #6b7280; text-align: center; }
    .sub { color: #d1d5db; margin-bottom: 2.5rem; }
  </style>
</head>
<body>
  <div style="min-height:100vh;display:flex;flex-direction:column">
    <header style="text-align:center;padding:3rem 1rem">
      <h1 style="font-size:3.75rem;font-weight:700;margin-bottom:1rem;line-height:1">
        <span>An I</span><span class="slash">/</span><span>O L</span><span class="slash">ink</span>
      </h1>
      <p style="font-size:1.25rem;color:#d1d5db">Transferencia P2P sin almacenamiento en servidor</p>
    </header>

    <main style="flex:1;display:flex;align-items:flex-start;justify-content:center;padding:0 1rem 3rem">
  <div class="card">
    <div class="token-row">
      <p class="label">Token</p>
      <div class="token">$token</div>
    </div>
    <button id="btn" class="btn" onclick="startDownload()" $btn_disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,152v56a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V152a8,8,0,0,1,16,0v56H208V152a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,132.69V40a8,8,0,0,0-16,0v92.69L93.66,106.34a8,8,0,0,0-11.32,11.32Z"></path></svg>
      Descargar Archivo
    </button>
    <div id="progress-section" class="progress-section">
      <div class="progress-header">
        <span>Progreso de descarga</span>
        <span id="progress-text">0%</span>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="status" class="status"></p>
    </div>
    <button id="http-btn" class="btn" style="display:none;margin-top:1rem" onclick="startHttpDownload()">Guardar con el navegador</button>
    <p class="note">El archivo se transferirá directamente desde el remitente</p>
    $error_msg
  </div>
    </main>

    <footer style="background:#1f2937;border-top:1px solid #374151;padding:1rem 0">
      <div style="text-align:center">
        <p style="display:flex;align-items:center;justify-content:center;gap:0.5rem">
          Hecho con <svg style="width:1.25rem;height:1.25rem;display:inline-block" viewBox="0 0 163.83836 158.46089" xmlns="http://www.w3.org/2000/svg"><path style="fill:#ec003f" d="m 173.27751,117.19664 c 8.95443,-15.99188 16.93438,-36.030858 12.4775,-53.550028 -4.45711,-17.51918 -17.45013,-31.20329 -34.08452,-35.89744 -16.63504,-4.69454 -34.38461,0.30236 -46.56213,13.13948 -12.176948,-12.82427 -29.925238,-17.83326 -46.559258,-13.13948 -16.63454,4.69378 -29.627413,18.37826 -34.084593,35.89744 -4.457596,17.5188 3.520617,37.558148 12.474703,53.550028 15.59737,27.85728 68.169148,67.28063 68.169148,67.28063 0,0 52.5711,-39.42373 68.16915,-67.28063 z" transform="translate(-23.190318,-26.016384)"/></svg> especialmente para ti!
        </p>
        <a href="https://github.com/elcamilet/aniolink" target="_blank" rel="noopener noreferrer" style="color:#2dd4bf;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Open Source Code</a> - <a href="https://elcamilet.com" target="_blank" rel="noopener noreferrer" style="color:#2dd4bf;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">elCamilet.com</a>
      </div>
    </footer>
  </div>
  <script>
    const TOKEN = '$token';
    const WS_URL = window.location.origin.replace(/^http/, 'ws') + '/' + TOKEN + '/signal';
    const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] };
    const LARGE_FILE_THRESHOLD = 1024 * 1024 * 1024;
    const IDLE_TIMEOUT_MS = 60000;
    const PROGRESS_INTERVAL = 1024 * 1024;
    const supportsFsa = typeof window.showSaveFilePicker === 'function';
    let httpFallbackTarget = null;
    let finishHttpFallback = null;

    function startHttpDownload() {
      if (!httpFallbackTarget) return;
      const btn = document.getElementById('http-btn');
      const status = document.getElementById('status');
      startNativeDownload(httpFallbackTarget.url, httpFallbackTarget.filename);
      if (btn) { btn.disabled = true; btn.textContent = 'Descarga iniciada'; }
      if (status) status.textContent = 'Descarga iniciada en el gestor de descargas del navegador...';
      // El GET ya arrancó; esperar un momento antes de cerrar el WebSocket
      // para que al emisor le haya llegado http_fallback.
      setTimeout(() => {
        const finish = finishHttpFallback;
        finishHttpFallback = null;
        if (finish) finish();
      }, 1000);
    }

    async function openDiskWriter(filename) {
      if (!supportsFsa) return null;
      try {
        const handle = await window.showSaveFilePicker({ suggestedName: filename || 'archivo' });
        return await handle.createWritable();
      } catch (error) {
        if (error && error.name === 'AbortError') throw error;
        return null;
      }
    }

    function saveBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      setTimeout(() => {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename || 'archivo';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      }, 0);
    }

    function startNativeDownload(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      if (filename) a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function startDownload() {
      const btn = document.getElementById('btn');
      const section = document.getElementById('progress-section');
      const bar = document.getElementById('progress-bar');
      const text = document.getElementById('progress-text');
      const status = document.getElementById('status');

      btn.disabled = true;
      section.style.display = 'block';

      // Sin File System Access no hay forma de escribir a disco desde JS.
      // Se usa el relay HTTP y el gestor de descargas del navegador: el
      // archivo no se acumula en memoria. El servidor avisa al emisor por
      // WebSocket y el emisor cambia al PUT.
      if (!supportsFsa) {
        btn.textContent = 'Descarga iniciada';
        status.textContent = 'Este navegador no permite guardar directamente en disco. La descarga usará el relay del servidor y el gestor de descargas del navegador.';
        startNativeDownload(window.location.origin + '/' + TOKEN + '?dl=1', '');
        return;
      }

      btn.textContent = 'Conectando...';
      status.textContent = 'Conectando al servidor de señalización...';

      let ws = null;
      let pc = null;
      let abortActiveTransfer = null;
      try {
        ws = new WebSocket(WS_URL);
        await new Promise((resolve, reject) => {
          ws.onopen = () => resolve();
          ws.onerror = () => reject(new Error('Error al conectar'));
          setTimeout(() => reject(new Error('Timeout')), 10000);
        });

        pc = new RTCPeerConnection(ICE);
        pc.onicecandidate = ({ candidate }) => {
          if (candidate && ws.readyState === WebSocket.OPEN)
            ws.send(JSON.stringify({ type: 'ice', candidate: candidate.toJSON() }));
        };

        status.textContent = 'Esperando al emisor...';

        await new Promise((resolve, reject) => {
          let metadata = null;
          const chunks = [];
          let receivedSize = 0;
          let eofReceived = false;
          const iceBuf = [];
          let remoteSet = false;
          let transferComplete = false;
          let dataChannel = null;
          let writable = null;
          let writeChain = Promise.resolve();
          let writeError = null;
          let writtenSize = 0;
          let lastProgressSent = 0;
          let finishing = false;
          let idleTimer = null;
          let abortHttp = null;
          let abortReason = null;
          let lastUi = 0;

          const setProgress = (received, total, force) => {
            const now = Date.now();
            if (!force && now - lastUi < 120) return;
            lastUi = now;
            if (total > 0) {
              const pct = Math.min(99, Math.round((received / total) * 100));
              bar.style.width = pct + '%';
              text.textContent = pct + '%';
              status.textContent = 'Descargando... ' + pct + '%';
            } else {
              status.textContent = 'Descargando... ' + (received / 1024 / 1024).toFixed(1) + ' MB';
            }
          };

          const resetIdle = () => {
            if (idleTimer) clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
              abortReason = 'Tiempo de inactividad agotado';
              if (abortHttp) abortHttp();
              if (writable) { try { writable.abort(); } catch (_) {} }
              reject(new Error(abortReason));
            }, IDLE_TIMEOUT_MS);
          };
          resetIdle();

          const abortWritable = () => {
            if (writable) {
              try { writable.abort(); } catch (_) {}
              writable = null;
            }
          };
          abortActiveTransfer = () => {
            abortWritable();
            if (abortHttp) abortHttp();
          };

          const finish = async () => {
            if (finishing || transferComplete) return;
            finishing = true;
            if (idleTimer) clearTimeout(idleTimer);
            try {
              await writeChain;
              if (writeError) throw writeError;
              if (writable) {
                await writable.close();
                writable = null;
              } else {
                saveBlob(new Blob(chunks, { type: metadata?.mime || 'application/octet-stream' }), metadata?.name || 'archivo');
              }
              transferComplete = true;
              bar.style.width = '100%';
              text.textContent = '100%';
              status.textContent = '¡Descarga completada!';
              btn.textContent = '¡Completado!';
              try {
                dataChannel?.send(JSON.stringify({ type: 'ack', size: receivedSize }));
              } catch (_) { /* el emisor ya se fue */ }
              resolve();
            } catch (e) {
              abortWritable();
              reject(e);
            }
          };

          ws.onmessage = async (event) => {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === 'peer_connected') {
                status.textContent = 'Emisor conectado, estableciendo P2P...';
              } else if (msg.type === 'offer') {
                await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
                remoteSet = true;
                for (const c of iceBuf) await pc.addIceCandidate(new RTCIceCandidate(c));
                iceBuf.length = 0;
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
                status.textContent = 'Estableciendo conexión P2P directa...';
              } else if (msg.type === 'ice' && msg.candidate) {
                if (remoteSet) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                else iceBuf.push(msg.candidate);
              } else if (msg.type === 'peer_disconnected') {
                if (!transferComplete && !finishing) reject(new Error('El emisor se desconectó'));
              } else if (msg.type === 'http_upload_available') {
                // El emisor es curl/terminal: descargar via HTTP GET en lugar de WebRTC
                if (idleTimer) clearTimeout(idleTimer);
                const totalSize = msg.size || 0;
                const filename = msg.filename || 'archivo';
                (async () => {
                  let diskWriter = null;
                  let httpIdle = null;
                  try {
                    if (supportsFsa) {
                      try {
                        diskWriter = await openDiskWriter(filename);
                      } catch (e) {
                        reject(e);
                        return;
                      }
                    }

                    // Sin FSA y archivo grande: dejar que el navegador lo guarde directo en disco
                    if (!diskWriter && totalSize > LARGE_FILE_THRESHOLD) {
                      status.textContent = 'Archivo grande: la descarga continuará en el gestor de descargas del navegador...';
                      startNativeDownload(window.location.origin + '/' + TOKEN + '?dl=1', filename);
                      transferComplete = true;
                      resolve();
                      return;
                    }

                    const controller = new AbortController();
                    abortHttp = () => {
                      abortReason = abortReason || 'Descarga cancelada';
                      controller.abort();
                      if (diskWriter) { try { diskWriter.abort(); } catch (_) {} }
                    };
                    const resetHttpIdle = () => {
                      if (httpIdle) clearTimeout(httpIdle);
                      httpIdle = setTimeout(() => {
                        abortReason = 'Tiempo de inactividad agotado';
                        controller.abort();
                        if (diskWriter) { try { diskWriter.abort(); } catch (_) {} }
                      }, IDLE_TIMEOUT_MS);
                    };
                    resetHttpIdle();

                    status.textContent = 'Recibiendo de terminal: ' + filename + '...';
                    const resp = await fetch(window.location.origin + '/' + TOKEN + '?dl=1', { signal: controller.signal });
                    if (!resp.ok) throw new Error('Error HTTP ' + resp.status);
                    if (!resp.body) throw new Error('El servidor no devolvió contenido');

                    const reader = resp.body.getReader();
                    const httpChunks = [];
                    let received = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      resetHttpIdle();
                      received += value.length;
                      if (diskWriter) await diskWriter.write(value);
                      else httpChunks.push(value);
                      setProgress(received, totalSize, false);
                    }
                    if (httpIdle) clearTimeout(httpIdle);
                    if (diskWriter) {
                      await diskWriter.close();
                      diskWriter = null;
                    } else {
                      saveBlob(new Blob(httpChunks, { type: resp.headers.get('Content-Type') || 'application/octet-stream' }), filename);
                    }
                    transferComplete = true;
                    bar.style.width = '100%';
                    text.textContent = '100%';
                    status.textContent = '¡Descarga completada!';
                    btn.textContent = '¡Completado!';
                    resolve();
                  } catch (e) {
                    if (httpIdle) clearTimeout(httpIdle);
                    if (diskWriter) { try { await diskWriter.abort(); } catch (_) {} }
                    if (!transferComplete) reject(new Error(abortReason || e.message));
                  }
                })();
              }
            } catch (e) {
              if (!transferComplete) reject(e);
            }
          };

          pc.ondatachannel = (event) => {
            const dc = event.channel;
            dataChannel = dc;
            dc.binaryType = 'arraybuffer';
            status.textContent = 'Canal P2P directo abierto. Recibiendo...';
            resetIdle();

            dc.onmessage = (evt) => {
              if (transferComplete || finishing) return;
              resetIdle();
              if (typeof evt.data === 'string') {
                try {
                  const msg = JSON.parse(evt.data);
                  if (msg.type === 'metadata') {
                    metadata = msg;
                    status.textContent = 'Recibiendo: ' + metadata.name;
                    (async () => {
                      if (idleTimer) clearTimeout(idleTimer);
                      try {
                        if (supportsFsa) {
                          try {
                            writable = await openDiskWriter(metadata.name);
                          } catch (e) {
                            reject(e);
                            return;
                          }
                        }
                        if (!writable && metadata.size > LARGE_FILE_THRESHOLD) {
                          // No se puede escribir a disco: pasar el archivo al
                          // relay HTTP y dejar que el navegador lo guarde. Así
                          // no se acumulan GB en memoria.
                          try {
                            dc.send(JSON.stringify({ type: 'http_fallback' }));
                          } catch (_) { /* el canal ya se cerró */ }
                          try {
                            ws.send(JSON.stringify({ type: 'http_fallback' }));
                          } catch (_) { /* el WS ya se cerró */ }
                          if (idleTimer) clearTimeout(idleTimer);
                          transferComplete = true;
                          httpFallbackTarget = {
                            url: window.location.origin + '/' + TOKEN + '?dl=1',
                            filename: metadata.name,
                          };
                          const httpBtn = document.getElementById('http-btn');
                          if (httpBtn) {
                            httpBtn.style.display = 'block';
                            httpBtn.disabled = false;
                            httpBtn.textContent = 'Guardar con el navegador';
                          }
                          status.textContent = 'Archivo grande: usa el botón para descargarlo sin cargarlo en memoria.';
                          finishHttpFallback = resolve;
                          return;
                        }
                        dc.send(JSON.stringify({ type: 'ready' }));
                        resetIdle();
                      } catch (e) {
                        reject(e);
                      }
                    })();
                  } else if (msg.type === 'eof') {
                    eofReceived = true;
                    finish();
                  }
                } catch (_) {
                  // Ignorar mensajes de control no JSON
                }
              } else {
                const buf = evt.data;
                receivedSize += buf.byteLength;
                writeChain = writeChain
                  .then(async () => {
                    if (writable) await writable.write(buf);
                    else chunks.push(buf);
                    writtenSize += buf.byteLength;
                    if (writtenSize - lastProgressSent >= PROGRESS_INTERVAL) {
                      lastProgressSent = writtenSize;
                      try {
                        dataChannel?.send(JSON.stringify({ type: 'progress', received: writtenSize }));
                        resetIdle();
                      } catch (_) { /* el canal ya se cerró */ }
                    }
                  })
                  .catch((err) => { writeError = err; });

                if (metadata?.size > 0) {
                  setProgress(receivedSize, metadata.size, false);
                  if (receivedSize >= metadata.size) finish();
                } else {
                  setProgress(receivedSize, 0, false);
                }
              }
            };

            dc.onclose = () => {
              if (transferComplete || finishing) return;
              if (eofReceived || (metadata?.size > 0 && receivedSize >= metadata.size)) {
                finish();
                return;
              }
              abortWritable();
              reject(new Error('Transferencia incompleta: el canal se cerró antes de recibir todos los datos'));
            };
            dc.onerror = () => {
              if (transferComplete || finishing) return;
              abortWritable();
              reject(new Error('Error en el canal de datos P2P'));
            };
          };

          pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed' && !transferComplete && !finishing) {
              abortWritable();
              reject(new Error('Conexión WebRTC fallida'));
            }
          };
          ws.onerror = () => { if (!transferComplete) reject(new Error('Error de WebSocket')); };
        });

        setTimeout(() => {
          status.textContent = '';
          bar.style.width = '0%';
          text.textContent = '0%';
        }, 3000);
      } catch (e) {
        status.textContent = '❌ ' + (e.message || 'Error desconocido');
        btn.disabled = false;
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M224,152v56a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V152a8,8,0,0,1,16,0v56H208V152a8,8,0,0,1,16,0Zm-101.66,5.66a8,8,0,0,0,11.32,0l40-40a8,8,0,0,0-11.32-11.32L136,132.69V40a8,8,0,0,0-16,0v92.69L93.66,106.34a8,8,0,0,0-11.32,11.32Z"></path></svg> Reintentar';
      } finally {
        if (abortActiveTransfer) abortActiveTransfer();
        if (ws && ws.readyState === WebSocket.OPEN) ws.close();
        // Dar tiempo a que el ACK del DataChannel salga antes de cerrar el transporte
        const pcRef = pc;
        setTimeout(() => { try { pcRef?.close(); } catch (_) {} }, 2000);
      }
    }
  </script>
</body>
</html>
